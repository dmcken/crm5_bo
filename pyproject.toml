[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm5_bo"
dynamic = ["version"]
authors = [
  { name="David Mc Ken", email="david.mcken@codepro.guru" },
]
description = "CRM 5 BackOffice Admin API"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
dependencies = [
  "python-dotenv",
  "requests",
]

[tool.hatch.version]
path = "src/crm5_bo/__init__.py"

[project.urls]
Homepage = "https://github.com/dmcken/crm5_bo"
Issues = "https://github.com/dmcken/crm5_bo/issues"

[dependency-groups]
test = [
  "pytest>=8",
]
lint = [
  "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
# Pinned explicitly: ruff's own no-config default varies by version/install
# (as of ruff 0.16 it's effectively "ALL" on this machine), which isn't
# reproducible across environments or CI. This is the rule set the codebase
# has actually been cleaned up against.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "DTZ",  # flake8-datetimez
]
